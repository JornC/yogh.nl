name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: 'kamal command'
        type: choice
        options: [deploy, setup, redeploy]
        default: deploy

concurrency: yogh-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Kamal
        run: gem install kamal -v '~> 2.10'

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server host key
        run: echo "${{ secrets.SERVER_HOST_KEY }}" >> ~/.ssh/known_hosts

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: kamal ${{ github.event.inputs.mode || 'deploy' }}
